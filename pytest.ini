[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
# -n auto reparte los tests entre los núcleos de la máquina. La suite juega
# partidas enteras y casi todo su tiempo es espera, así que en serie tarda
# minutos y en paralelo, segundos. Para depurar con pdb: -n0.
addopts = -q --strict-markers -n auto
