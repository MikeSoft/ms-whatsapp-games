[project]
name = "ms-whatsapp-games"
version = "0.1.0"
description = "A game master for text games played in WhatsApp groups, on FastAPI, WAHA and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/MikeSoft/ms-whatsapp-games"
Documentation = "https://github.com/MikeSoft/ms-whatsapp-games/tree/master/docs"

[tool.ruff]
line-length = 95
target-version = "py311"
exclude = [".venv", "data"]

[tool.ruff.lint]
# BLE está activo a propósito: el servicio captura excepciones amplias en
# los bordes (WAHA, LLM, Redis) para degradar en vez de tumbar una partida,
# y cada caso lleva su `noqa: BLE001` como marca de que es deliberado.
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
ignore = [
    # Los mensajes de log llevan textos largos en español.
    "E501",
    # `zip(strict=)` ya se usa donde importa.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Los tests acceden a atributos internos del orquestador a propósito.
"tests/*" = ["SLF001"]
